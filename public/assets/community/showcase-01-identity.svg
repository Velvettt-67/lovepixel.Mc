<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220b15" />
      <stop offset="40%" stop-color="#3c1424" />
      <stop offset="75%" stop-color="#541b31" />
      <stop offset="100%" stop-color="#1e0812" />
    </linearGradient>

    <radialGradient id="centerBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e89cb0" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#c9647e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3c1424" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fddde6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3c1424" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fcedf1" />
      <stop offset="65%" stop-color="#f3b4c4" />
      <stop offset="100%" stop-color="#df899f" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7cad5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9a3b54" stop-opacity="0.2" />
    </linearGradient>

    <filter id="softGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowBehind" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Deep Velvet Plum Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow Fields -->
  <circle cx="800" cy="500" r="600" fill="url(#centerBloom)" />
  <circle cx="1200" cy="200" r="450" fill="url(#cornerGlow)" />
  <circle cx="300" cy="800" r="400" fill="url(#cornerGlow)" opacity="0.6" />

  <!-- Fine Editorial Border Frame -->
  <rect x="60" y="60" width="1480" height="880" rx="24" fill="none" stroke="rgba(247, 202, 213, 0.22)" stroke-width="1.5" />
  <rect x="76" y="76" width="1448" height="848" rx="16" fill="none" stroke="rgba(247, 202, 213, 0.08)" stroke-width="1" />

  <!-- Editorial Corner Marks -->
  <path d="M 60 120 L 60 60 L 120 60" fill="none" stroke="#f3b4c4" stroke-width="2.5" opacity="0.6" />
  <path d="M 1540 120 L 1540 60 L 1480 60" fill="none" stroke="#f3b4c4" stroke-width="2.5" opacity="0.6" />
  <path d="M 60 880 L 60 940 L 120 940" fill="none" stroke="#f3b4c4" stroke-width="2.5" opacity="0.6" />
  <path d="M 1540 880 L 1540 940 L 1480 940" fill="none" stroke="#f3b4c4" stroke-width="2.5" opacity="0.6" />

  <!-- Botanical Vines & Petals Artwork in Background -->
  <g opacity="0.35">
    <path d="M 150 900 C 300 700 250 450 400 300 C 500 200 650 250 720 180" fill="none" stroke="url(#stemGrad)" stroke-width="2" />
    <path d="M 1450 150 C 1300 350 1350 600 1200 750 C 1100 850 950 800 880 870" fill="none" stroke="url(#stemGrad)" stroke-width="2" />
    <!-- Floating Petal Silhouettes -->
    <path d="M 320 420 C 340 390 380 400 370 430 C 360 460 310 450 320 420 Z" fill="#f7cad5" opacity="0.4" />
    <path d="M 440 280 C 470 260 490 290 480 320 C 460 340 430 310 440 280 Z" fill="#f3b4c4" opacity="0.5" />
    <path d="M 1240 680 C 1270 650 1300 680 1290 710 C 1270 740 1220 710 1240 680 Z" fill="#f7cad5" opacity="0.45" />
    <path d="M 1120 790 C 1140 760 1180 770 1170 800 C 1150 830 1110 810 1120 790 Z" fill="#e89cb0" opacity="0.4" />
  </g>

  <!-- Editorial Top Metadata -->
  <text x="120" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="4" fill="#f7cad5" opacity="0.75" font-weight="600">SERIES 01 // SANCTUARY ARCHIVE</text>
  <text x="1480" y="125" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="4" fill="#f7cad5" opacity="0.75" font-weight="600">AUTHENTIC COMMUNITY IDENTITY</text>

  <!-- Central Ambient Silhouette Glow for Typography -->
  <ellipse cx="800" cy="500" rx="420" ry="180" fill="#f3b4c4" opacity="0.12" filter="url(#glowBehind)" />

  <!-- Signature Editorial / Handwritten "LovePixels" Typography -->
  <!-- Backing Glow Layer -->
  <text x="800" y="525" text-anchor="middle" font-family="'Pinyon Script', cursive" font-size="168" fill="#e89cb0" opacity="0.5" filter="url(#glowBehind)">LovePixels</text>
  
  <!-- Main Articulated Handwritten Lettering -->
  <text x="800" y="520" text-anchor="middle" font-family="'Pinyon Script', cursive" font-size="164" fill="url(#goldRoseGrad)" filter="url(#softGlowFilter)">LovePixels</text>

  <!-- Supporting Editorial Inscription -->
  <text x="800" y="605" text-anchor="middle" font-family="'Italiana', 'Cormorant Garamond', serif" font-size="22" letter-spacing="9" fill="#fdf2f4" opacity="0.92">WHERE STRANGERS BECOME MEMORIES</text>

  <line x1="680" y1="640" x2="920" y2="640" stroke="rgba(247, 202, 213, 0.4)" stroke-width="1" />

  <text x="800" y="675" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="6" fill="#e89cb0" opacity="0.75">EST. 2025 • A SOFT LUXURY DISCORD SPACE</text>

  <!-- Editorial Bottom Metadata -->
  <text x="120" y="895" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" fill="#f7cad5" opacity="0.6">DISCORD.GG/KWHCDGG2F</text>
  <text x="800" y="895" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" fill="#f7cad5" opacity="0.5">CURATED VISUAL PILLAR • 01 / 07</text>
  <text x="1480" y="895" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" fill="#f7cad5" opacity="0.6">© 2026 LOVEPIXELS</text>
</svg>
